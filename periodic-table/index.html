<style>
  :root{
    --bg:#0b0e17;
    --panel:#111624;
    --edge:#232c42;
    --ink:#e9edfb;
    --dim:#8e99b8;
    --c-alkali:#ff6b6b;
    --c-alkaline:#ffa94d;
    --c-transition:#ffd43b;
    --c-post:#20c997;
    --c-metalloid:#66d9e8;
    --c-nonmetal:#8ce99a;
    --c-halogen:#4dabf7;
    --c-noble:#b197fc;
    --c-lanth:#f783ac;
    --c-act:#e599f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, #17203a 0%, transparent 55%),
      radial-gradient(ellipse at 110% 110%, #131b31 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:Inter,system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    padding-bottom:190px;
  }
  .hub-link{position:fixed;top:14px;left:14px;z-index:1000;padding:8px 14px;border-radius:999px;font:600 13px/1 Inter,system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(8px);background:rgba(15,15,25,.55);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .hub-link:hover{border-color:var(--c-transition)}

  header{
    padding:20px clamp(16px,4vw,40px) 4px;
    display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;
  }
  .title-block{padding-left:96px}
  header h1{
    font:700 clamp(22px,4.5vw,36px)/1.05 "Space Grotesk",sans-serif;letter-spacing:-.01em;
    background:linear-gradient(100deg,#fff,#ffd43b 55%,#f783ac);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header .sub{font:500 clamp(11px,1.7vw,13px)/1.4 Inter,sans-serif;color:var(--dim);margin-top:2px}
  .search-wrap{display:flex;align-items:center;gap:10px;flex:1 1 260px;max-width:420px;min-width:200px}
  #search{
    flex:1;min-height:46px;padding:0 16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--edge);color:var(--ink);
    font:500 15px/1 Inter,sans-serif;
  }
  #search::placeholder{color:#5c688a}
  #search:focus-visible{outline:2px solid var(--c-transition);outline-offset:1px}
  #matchCount{font:600 11px/1.3 "Space Grotesk",sans-serif;color:var(--dim);white-space:nowrap}

  nav.chips{
    display:flex;gap:8px;overflow-x:auto;padding:12px clamp(16px,4vw,40px);
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;
  }
  .chip{
    flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--edge);color:var(--dim);
    font:600 12px/1 Inter,sans-serif;
    transition:transform .15s ease,border-color .15s ease,color .15s ease;
  }
  .chip .dot{width:10px;height:10px;border-radius:50%;background:var(--dot,#666)}
  .chip:hover{transform:translateY(-2px);color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--c-transition);outline-offset:2px}
  .chip[aria-pressed="true"]{color:#0b0e17;background:var(--dot,#fff);border-color:var(--dot,#fff)}
  .chip[aria-pressed="true"] .dot{background:#0b0e17}

  .table-scroll{
    overflow-x:auto;padding:8px clamp(16px,4vw,40px) 20px;
    -webkit-overflow-scrolling:touch;
  }
  #ptable{
    display:grid;
    grid-template-columns:repeat(18,minmax(52px,1fr));
    grid-template-rows:repeat(7,auto) 16px auto auto;
    gap:4px;
    min-width:1060px;
  }
  button.el{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:56px;padding:4px 2px;border-radius:8px;cursor:pointer;
    background:#0d1120;
    background:color-mix(in srgb, var(--c) 13%, #0d1120);
    border:1px solid #2b3554;
    border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
    color:var(--c);
    font-family:"Space Grotesk",sans-serif;
    transition:transform .14s ease,opacity .25s ease,box-shadow .14s ease;
    animation:cellIn .45s ease backwards;
    animation-delay:calc(var(--i) * 5ms);
  }
  @keyframes cellIn{from{opacity:0;transform:translateY(8px)}}
  button.el .num{position:absolute;top:3px;left:5px;font:600 9px/1 Inter,sans-serif;color:var(--dim)}
  button.el .sym{font:700 clamp(15px,1.4vw,19px)/1.1 "Space Grotesk",sans-serif}
  button.el .mass{font:500 8.5px/1.2 Inter,sans-serif;color:var(--dim);margin-top:2px}
  button.el:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 14px color-mix(in srgb, var(--c) 35%, transparent);z-index:2}
  button.el:focus-visible{outline:2px solid #fff;outline-offset:1px;z-index:2}
  button.el.dimmed{opacity:.12;pointer-events:auto}
  button.el.selected{background:var(--c);color:#0b0e17;box-shadow:0 0 20px color-mix(in srgb, var(--c) 60%, transparent)}
  button.el.selected .num,button.el.selected .mass{color:rgba(10,12,20,.75)}
  .marker{
    display:flex;align-items:center;justify-content:center;border-radius:8px;
    border:1px dashed var(--edge);color:var(--dim);
    font:600 10px/1 "Space Grotesk",sans-serif;min-height:56px;
  }

  /* ---------- detail card ---------- */
  #detail{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:900;
    width:min(94vw,700px);
    background:rgba(15,20,36,.92);backdrop-filter:blur(12px);
    border:1px solid var(--edge);border-radius:18px;
    padding:16px 18px;
    display:flex;gap:16px;align-items:center;
    box-shadow:0 14px 50px rgba(0,0,0,.55);
  }
  #dTile{
    flex:0 0 auto;width:74px;height:74px;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0d1120;
    background:color-mix(in srgb, var(--c,#8e99b8) 16%, #0d1120);
    border:1px solid #2b3554;
    border:1px solid color-mix(in srgb, var(--c,#8e99b8) 55%, transparent);
    color:var(--c,#8e99b8);
  }
  #dTile .sym{font:700 26px/1 "Space Grotesk",sans-serif}
  #dTile .num{font:600 11px/1.4 Inter,sans-serif;color:var(--dim)}
  #dBody{min-width:0;flex:1}
  #dName{font:700 clamp(17px,3vw,22px)/1.15 "Space Grotesk",sans-serif;color:#fff}
  #dMeta{font:600 11px/1.5 Inter,sans-serif;color:var(--dim);margin:2px 0 6px}
  #dMeta .cat{color:var(--c,#fff)}
  #dUse{font:400 13px/1.55 Inter,sans-serif;color:#cdd6ee;max-height:88px;overflow-y:auto}
  @media (max-width:560px){
    .title-block{padding-left:88px}
    #detail{padding:12px;gap:12px;bottom:8px}
    #dTile{width:60px;height:60px}
    #dTile .sym{font-size:21px}
    body{padding-bottom:170px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition-duration:.001s!important}
  }
</style>

  [118,'Og','Oganesson','[294]',7,7,18,'Named for physicist Yuri Oganessian — one of two elements named for a living person. Roughly five atoms have ever been made.']

  var table = document.getElementById('ptable');
  var chipsNav = document.querySelector('nav.chips');
  var searchInput = document.getElementById('search');
  var matchCount = document.getElementById('matchCount');

  /* ---------- build category chips ---------- */
  var activeCat = -1; // -1 = all
  function makeChip(label, cat, colorVar){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.setAttribute('aria-pressed', cat === -1 ? 'true' : 'false');
    if (colorVar) b.style.setProperty('--dot', 'var(' + colorVar + ')');
    else b.style.setProperty('--dot', '#e9edfb');
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.setAttribute('aria-hidden', 'true');
    b.appendChild(dot);
    b.appendChild(document.createTextNode(label));
    b.addEventListener('click', function(){
      activeCat = (activeCat === cat) ? -1 : cat;
      Array.prototype.forEach.call(chipsNav.children, function(c, ci){
        var cCat = ci === 0 ? -1 : ci - 1;
        c.setAttribute('aria-pressed', String(cCat === activeCat));
      });
      applyFilters();
    });
    chipsNav.appendChild(b);
  }
  makeChip('All', -1, null);
  CATS.forEach(function(c, i){ makeChip(c[0], i, c[1]); });

  /* ---------- build table ---------- */
  function gridPos(el){
    var n = el[0];
    if (n >= 57 && n <= 71) return { col: n - 57 + 3, row: 9 };
    if (n >= 89 && n <= 103) return { col: n - 89 + 3, row: 10 };
    return { col: el[6], row: el[5] };
  }
  var cells = [];
  E.forEach(function(el, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'el';
    b.style.setProperty('--c', 'var(' + CATS[el[4]][1] + ')');
    b.style.setProperty('--i', String(i));
    var pos = gridPos(el);
    b.style.gridColumn = String(pos.col);
    b.style.gridRow = String(pos.row);
    b.setAttribute('aria-label', el[2] + ', symbol ' + el[1] + ', element ' + el[0] + ', ' + CATS[el[4]][0]);
    b.dataset.idx = String(i);
    b.innerHTML = '<span class="num">' + el[0] + '</span><span class="sym">' + el[1] + '</span><span class="mass">' + el[3] + '</span>';
    table.appendChild(b);
    cells.push(b);
  });
  // f-block markers
  function marker(text, col, row){
    var m = document.createElement('div');
    m.className = 'marker';
    m.textContent = text;
    m.style.gridColumn = String(col);
    m.style.gridRow = String(row);
    m.setAttribute('aria-hidden', 'true');
    table.appendChild(m);
  }
  marker('57–71', 3, 6);
  marker('89–103', 3, 7);

  /* ---------- detail card ---------- */
  var detailCard = document.getElementById('detail');
  var dSym = document.getElementById('dSym');
  var dNum = document.getElementById('dNum');
  var dName = document.getElementById('dName');
  var dMeta = document.getElementById('dMeta');
  var dUse = document.getElementById('dUse');
  var selectedIdx = -1;

  function showDetail(i){
    var el = E[i];
    detailCard.style.setProperty('--c', 'var(' + CATS[el[4]][1] + ')');
    dSym.textContent = el[1];
    dNum.textContent = String(el[0]);
    dName.textContent = el[2];
    var groupTxt = el[6] === 0 ? 'f-block' : 'Group ' + el[6];
    dMeta.innerHTML = '<span class="cat">' + CATS[el[4]][0] + '</span> · Period ' + el[5] + ' · ' + groupTxt + ' · mass ' + el[3];
    dUse.textContent = el[7];
  }

  table.addEventListener('pointerover', function(ev){
    var b = ev.target.closest('button.el');
    if (b) showDetail(parseInt(b.dataset.idx, 10));
  });
  table.addEventListener('pointerout', function(ev){
    if (selectedIdx >= 0 && !ev.relatedTarget) showDetail(selectedIdx);
  });
  table.addEventListener('focusin', function(ev){
    var b = ev.target.closest('button.el');
    if (b) showDetail(parseInt(b.dataset.idx, 10));
  });
  table.addEventListener('click', function(ev){
    var b = ev.target.closest('button.el');
    if (!b) return;
    var i = parseInt(b.dataset.idx, 10);
    if (selectedIdx === i){
      selectedIdx = -1;
      b.classList.remove('selected');
    } else {
      if (selectedIdx >= 0) cells[selectedIdx].classList.remove('selected');
      selectedIdx = i;
      b.classList.add('selected');
    }
    showDetail(i);
  });
  table.addEventListener('pointerleave', function(){
    if (selectedIdx >= 0) showDetail(selectedIdx);
  });

  /* ---------- search + filter ---------- */
  var query = '';
  function matches(el){
    if (activeCat >= 0 && el[4] !== activeCat) return false;
    if (!query) return true;
    var name = el[2].toLowerCase();
    var sym = el[1].toLowerCase();
    var num = String(el[0]);
    return name.indexOf(query) !== -1 || sym.indexOf(query) === 0 || num.indexOf(query) === 0;
  }
  function applyFilters(){
    var shown = 0;
    E.forEach(function(el, i){
      var ok = matches(el);
      cells[i].classList.toggle('dimmed', !ok);
      if (ok) shown++;
    });
    matchCount.textContent = shown + ' / 118';
  }
  searchInput.addEventListener('input', function(){
    query = searchInput.value.trim().toLowerCase();
    applyFilters();
  });
  applyFilters();
})();
</script>
</body>
</html>
