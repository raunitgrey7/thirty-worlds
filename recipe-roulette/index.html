<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Roulette — What's for Dinner?</title>
<meta name="description" content="Recipe Roulette: spin a big diner-style wheel of 16 real dinner ideas — from shakshuka to miso ramen — and get a cookable recipe card with ingredients and steps. Vegetarian mode included.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">

<style>
:root{
  --cherry:#d7263d;
  --cherry-dark:#a41328;
  --cream:#fdf3e3;
  --cream-2:#f7e8cf;
  --mustard:#e9b44c;
  --teal:#2b7a78;
  --ink:#4a2328;
  --disp:'Lilita One',system-ui,sans-serif;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cream);color:var(--ink);font-family:var(--sans);
  min-height:100vh;overflow-x:hidden;
  background-image:repeating-linear-gradient(45deg, rgba(215,38,61,.045) 0 18px, transparent 18px 36px);
}
.hub-link{position:fixed;top:14px;left:14px;z-index:1000;padding:8px 14px;border-radius:999px;font:600 13px/1 Inter,system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(8px);background:rgba(74,35,40,.8);color:#fff;border:1px solid rgba(255,255,255,.3)}
.hub-link:hover{background:rgba(74,35,40,.95)}
.wrap{max-width:640px;margin:0 auto;padding:70px 16px 46px;display:flex;flex-direction:column;align-items:center}
header.mast{text-align:center;margin-bottom:14px}
h1{
  font-family:var(--disp);font-weight:400;
  font-size:clamp(2.2rem,8vw,3.6rem);
  color:var(--cherry);
  text-shadow:2px 2px 0 var(--mustard),4px 4px 0 rgba(74,35,40,.15);
  letter-spacing:.01em;
}
.sub{color:#8c5f56;font-size:.95rem;margin-top:4px}
.veg-row{display:flex;align-items:center;gap:10px;margin:10px 0 18px;min-height:44px}
.switch{position:relative;display:inline-block;width:56px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.slider{
  position:absolute;inset:0;border-radius:999px;background:#d9c6ab;
  transition:background .2s;border:2px solid rgba(74,35,40,.25);
}
.slider::before{
  content:"";position:absolute;width:22px;height:22px;border-radius:50%;
  left:3px;top:3px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform .2s;
}
.switch input:checked + .slider{background:var(--teal)}
.switch input:checked + .slider::before{transform:translateX(24px)}
.switch input:focus-visible + .slider{outline:3px solid var(--mustard);outline-offset:3px}
.veg-row label.txt{font:600 .92rem var(--sans);cursor:pointer}
/* wheel */
.wheel-zone{position:relative;width:min(92vw,440px);margin:0 auto}
.ticker{
  position:absolute;top:-6px;left:50%;z-index:6;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;
  border-top:30px solid var(--cherry-dark);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
  transform-origin:50% 20%;
}
.ticker.tick{animation:tick-wiggle .12s}
@keyframes tick-wiggle{50%{transform:translateX(-50%) rotate(9deg)}}
#wheel{display:block;width:100%;height:auto;touch-action:none;cursor:grab;border-radius:50%}
#wheel.dragging{cursor:grabbing}
.spin-btn{
  position:absolute;left:50%;top:50%;z-index:5;
  transform:translate(-50%,-50%);
  width:clamp(84px,24%,110px);aspect-ratio:1/1;border-radius:50%;
  appearance:none;cursor:pointer;
  font-family:var(--disp);font-size:clamp(1rem,4vw,1.3rem);letter-spacing:.05em;
  background:var(--cherry);color:var(--cream);
  border:5px solid var(--cream);
  box-shadow:0 6px 0 var(--cherry-dark),0 10px 24px rgba(74,35,40,.35);
  transition:transform .12s,box-shadow .12s;
}
.spin-btn:hover{transform:translate(-50%,-52%)}
.spin-btn:active{transform:translate(-50%,-48%);box-shadow:0 2px 0 var(--cherry-dark)}
.spin-btn:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
.spin-btn:disabled{cursor:wait;filter:saturate(.6)}
.drag-hint{text-align:center;margin-top:10px;font-size:.8rem;color:#a3776b}
/* recipe card */
.card{
  width:100%;margin-top:26px;
  background:#fffaf0;border:3px solid var(--ink);border-radius:18px;
  box-shadow:8px 8px 0 var(--mustard);
  padding:24px 22px;
  animation:card-in .45s cubic-bezier(.2,1.3,.4,1);
}
@keyframes card-in{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.card .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.card .big-emoji{font-size:3rem;line-height:1}
.card h2{font-family:var(--disp);font-weight:400;font-size:clamp(1.5rem,6vw,2.1rem);color:var(--cherry)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{
  font:600 .75rem var(--sans);padding:6px 12px;border-radius:999px;
  background:var(--cream-2);border:1.5px solid rgba(74,35,40,.2);
}
.pill.veg{background:#dff0e4;border-color:var(--teal);color:#1d5a52}
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;margin-top:18px}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.card h3{font:700 .78rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#8c5f56;margin-bottom:8px}
.card ul{list-style:none}
.card ul li{padding:6px 0 6px 24px;position:relative;font-size:.92rem;border-bottom:1px dashed var(--cream-2)}
.card ul li::before{content:"•";position:absolute;left:6px;color:var(--cherry);font-weight:700}
.card ol{list-style:none;counter-reset:step}
.card ol li{
  counter-increment:step;position:relative;
  padding:8px 0 8px 40px;font-size:.92rem;line-height:1.5;
}
.card ol li::before{
  content:counter(step);position:absolute;left:0;top:8px;
  width:26px;height:26px;border-radius:50%;
  background:var(--mustard);color:var(--ink);
  font:700 .8rem/26px var(--sans);text-align:center;
}
.again-row{margin-top:18px;text-align:center}
.btn{
  appearance:none;cursor:pointer;
  font-family:var(--disp);font-size:1rem;letter-spacing:.04em;
  background:var(--teal);color:var(--cream);border:0;border-radius:12px;
  padding:13px 30px;min-height:48px;
  box-shadow:0 4px 0 #1d5a52;
  transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d5a52}
.btn:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
/* history */
.history{width:100%;margin-top:22px;text-align:center}
.history h3{font:700 .75rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#a3776b;margin-bottom:10px}
.history .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.history .chip{
  font:600 .82rem var(--sans);padding:8px 14px;border-radius:999px;
  background:#fffaf0;border:2px solid var(--cream-2);color:var(--ink);
  animation:card-in .3s ease-out;
}
.confetti-zone{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetto{
  position:absolute;width:10px;height:14px;top:-20px;
  animation:conf-fall 1.4s ease-in forwards;
}
@keyframes conf-fall{
  from{transform:translateY(0) rotate(0)}
  to{transform:translateY(110vh) rotate(560deg);opacity:.7}
}
footer{margin-top:30px;text-align:center;font-size:.72rem;color:#a3776b}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}
</style>

  </section>
</main>
<footer>16 real dinners · zero arguments · est. 2026</footer>

  { name:"Margherita Pizza", emoji:"🍕", time:"45 min", diff:"Medium", veg:true,

var SLICE_COLORS = ["#d7263d","#fdf3e3","#e9b44c","#2b7a78"];
var TEXT_COLORS  = ["#fdf3e3","#5a2a27","#4a2328","#fdf3e3"];

var canvas = document.getElementById('wheel');
var ctx = canvas.getContext('2d');
var ticker = document.getElementById('ticker');
var btnSpin = document.getElementById('btn-spin');
var btnAgain = document.getElementById('btn-again');
var vegToggle = document.getElementById('veg-toggle');
var cardEl = document.getElementById('recipe-card');
var rEmoji = document.getElementById('r-emoji');
var rName = document.getElementById('r-name');
var rTime = document.getElementById('r-time');
var rDiff = document.getElementById('r-diff');
var rVeg = document.getElementById('r-veg');
var rIng = document.getElementById('r-ing');
var rSteps = document.getElementById('r-steps');
var historyEl = document.getElementById('history');
var historyChips = document.getElementById('history-chips');
var confettiZone = document.getElementById('confetti-zone');

var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var TWO_PI = Math.PI * 2;

var wheel = {
  items: DISHES.slice(),
  angle: Math.random() * TWO_PI,
  vel: 0,
  spinning: false,
  rafId: null,
  lastSlice: -1,
  cssSize: 440
};
var history = [];
try {
  var h = localStorage.getItem('rr-history');
  if (h) history = JSON.parse(h).slice(0, 3);
} catch(e){ history = []; }

function activeItems(){
  return vegToggle.checked ? DISHES.filter(function(d){ return d.veg; }) : DISHES.slice();
}

function fit(){
  var dpr = window.devicePixelRatio || 1;
  var zone = canvas.parentElement;
  var cssSize = zone.clientWidth;
  if (cssSize < 100) cssSize = 100;
  wheel.cssSize = cssSize;
  canvas.width = Math.round(cssSize * dpr);
  canvas.height = Math.round(cssSize * dpr);
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  draw();
}

function draw(){
  var W = canvas.width;
  var c = W / 2;
  var R = c - 4;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, W);
  var n = wheel.items.length;
  var step = TWO_PI / n;
  /* outer rim */
  ctx.beginPath();
  ctx.arc(c, c, R, 0, TWO_PI);
  ctx.fillStyle = '#4a2328';
  ctx.fill();
  var inner = R - W * 0.018;
  for (var i = 0; i < n; i++) {
    var a0 = wheel.angle + i * step;
    var a1 = a0 + step;
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, inner, a0, a1);
    ctx.closePath();
    ctx.fillStyle = SLICE_COLORS[i % SLICE_COLORS.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(74,35,40,.35)';
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.stroke();
  }
  /* labels */
  var fontPx = Math.max(10, Math.round(W * (n > 12 ? 0.026 : 0.032)));
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var j = 0; j < n; j++) {
    var mid = wheel.angle + (j + 0.5) * step;
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(mid);
    ctx.fillStyle = TEXT_COLORS[j % TEXT_COLORS.length];
    ctx.font = '600 ' + fontPx + 'px Inter, sans-serif';
    ctx.fillText(wheel.items[j].emoji + ' ' + wheel.items[j].name, inner - W * 0.03, 0);
    ctx.restore();
  }
  /* hub ring (button sits on top) */
  ctx.beginPath();
  ctx.arc(c, c, W * 0.15, 0, TWO_PI);
  ctx.fillStyle = '#4a2328';
  ctx.fill();
}

function currentSliceIndex(){
  var n = wheel.items.length;
  var step = TWO_PI / n;
  /* pointer sits at the top: angle -PI/2 in canvas space */
  var rel = (-Math.PI / 2 - wheel.angle) % TWO_PI;
  if (rel < 0) rel += TWO_PI;
  return Math.floor(rel / step) % n;
}

function tickPointer(){
  ticker.classList.remove('tick');
  void ticker.offsetWidth;
  ticker.classList.add('tick');
}

function frame(){
  wheel.rafId = requestAnimationFrame(frame);
  wheel.angle = (wheel.angle + wheel.vel) % TWO_PI;
  wheel.vel *= 0.9885;
  var slice = currentSliceIndex();
  if (slice !== wheel.lastSlice) {
    wheel.lastSlice = slice;
    if (!reduceMotion) tickPointer();
  }
  draw();
  if (Math.abs(wheel.vel) < 0.0025) {
    stopLoop();
    wheel.spinning = false;
    btnSpin.disabled = false;
    land(wheel.items[currentSliceIndex()]);
  }
}

function stopLoop(){
  if (wheel.rafId !== null) { cancelAnimationFrame(wheel.rafId); wheel.rafId = null; }
}

function spin(){
  if (wheel.spinning) return;
  wheel.items = activeItems();
  wheel.spinning = true;
  btnSpin.disabled = true;
  cardEl.hidden = true;
  var power = reduceMotion ? 0.12 : (0.3 + Math.random() * 0.18);
  wheel.vel = power; /* clockwise from the button */
  stopLoop();
  wheel.rafId = requestAnimationFrame(frame);
}

function land(dish){
  showRecipe(dish);
  pushHistory(dish);
  if (!reduceMotion) confetti();
}

function showRecipe(d){
  rEmoji.textContent = d.emoji;
  rName.textContent = d.name;
  rTime.textContent = '⏱ ' + d.time;
  rDiff.textContent = d.diff;
  rVeg.hidden = !d.veg;
  rIng.textContent = '';
  d.ing.forEach(function(x){
    var li = document.createElement('li');
    li.textContent = x;
    rIng.appendChild(li);
  });
  rSteps.textContent = '';
  d.steps.forEach(function(x){
    var li = document.createElement('li');
    li.textContent = x;
    rSteps.appendChild(li);
  });
  cardEl.hidden = false;
  cardEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
}

function pushHistory(d){
  history.unshift(d.emoji + ' ' + d.name);
  history = history.slice(0, 3);
  try { localStorage.setItem('rr-history', JSON.stringify(history)); } catch(e){}
  renderHistory();
}

function renderHistory(){
  if (history.length === 0) { historyEl.hidden = true; return; }
  historyEl.hidden = false;
  historyChips.textContent = '';
  history.forEach(function(name){
    var s = document.createElement('span');
    s.className = 'chip';
    s.textContent = name;
    historyChips.appendChild(s);
  });
}

function confetti(){
  var colors = ['#d7263d','#e9b44c','#2b7a78','#fdf3e3'];
  for (var i = 0; i < 26; i++) {
    var p = document.createElement('span');
    p.className = 'confetto';
    p.style.left = (5 + Math.random() * 90) + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.25) + 's';
    p.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    confettiZone.appendChild(p);
    (function(el){
      el.addEventListener('animationend', function(){ el.remove(); });
      setTimeout(function(){ if (el.parentNode) el.remove(); }, 2600);
    })(p);
  }
}

/* drag to spin */
var drag = null;
function pointerAngle(e){
  var rect = canvas.getBoundingClientRect();
  var x = e.clientX - (rect.left + rect.width / 2);
  var y = e.clientY - (rect.top + rect.height / 2);
  return Math.atan2(y, x);
}
canvas.addEventListener('pointerdown', function(e){
  if (wheel.spinning) return;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
  drag = { last: pointerAngle(e), vel: 0, t: performance.now() };
  e.preventDefault();
});
canvas.addEventListener('pointermove', function(e){
  if (!drag) return;
  var a = pointerAngle(e);
  var da = a - drag.last;
  if (da > Math.PI) da -= TWO_PI;
  if (da < -Math.PI) da += TWO_PI;
  wheel.angle = (wheel.angle + da) % TWO_PI;
  var now = performance.now();
  var dt = Math.max(8, now - drag.t);
  drag.vel = da / dt * 16.7; /* per-frame velocity */
  drag.last = a;
  drag.t = now;
  draw();
  e.preventDefault();
});
function endDrag(e){
  if (!drag) return;
  canvas.classList.remove('dragging');
  var v = drag.vel;
  drag = null;
  if (Math.abs(v) > 0.02) {
    wheel.items = activeItems();
    wheel.spinning = true;
    btnSpin.disabled = true;
    cardEl.hidden = true;
    wheel.vel = Math.max(-0.55, Math.min(0.55, v));
    stopLoop();
    wheel.rafId = requestAnimationFrame(frame);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* controls */
btnSpin.addEventListener('click', spin);
btnAgain.addEventListener('click', function(){
  spin();
  var zone = canvas.parentElement;
  zone.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
});
vegToggle.addEventListener('change', function(){
  if (wheel.spinning) return;
  wheel.items = activeItems();
  wheel.lastSlice = -1;
  cardEl.hidden = true;
  draw();
});

/* pause the wheel while the tab is hidden */
var hiddenPause = false;
document.addEventListener('visibilitychange', function(){
  if (document.hidden && wheel.spinning) {
    hiddenPause = true;
    stopLoop();
  } else if (!document.hidden && hiddenPause) {
    hiddenPause = false;
    if (wheel.spinning) wheel.rafId = requestAnimationFrame(frame);
  }
});

window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){ draw(); }).catch(function(){});
}

wheel.items = activeItems();
renderHistory();
fit();
})();
</script>
</body>
</html>
