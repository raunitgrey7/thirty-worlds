<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost World — Thirty Worlds</title>
<meta name="description" content="This world doesn't exist — but thirty others do.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(60vw 60vw at 50% -20%,rgba(94,110,255,.22),transparent 60%),#07070f;
    color:#eef0ff;font-family:Inter,system-ui,sans-serif;padding:24px;overflow:hidden}
  .ufo{font-size:72px;display:inline-block;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(4deg)}}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(36px,7vw,72px);margin:18px 0 10px;letter-spacing:-.02em}
  p{color:#9aa0c3;line-height:1.6;max-width:420px;margin:0 auto 28px}
  a{display:inline-block;font:600 15px/1 Inter,sans-serif;color:#0a0a14;background:#eef0ff;text-decoration:none;
    padding:15px 26px;border-radius:999px;transition:transform .2s}
  a:hover{transform:translateY(-2px)}
  a:focus-visible{outline:2px solid #7ea2ff;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.ufo{animation:none}}
</style>
</head>
<body>
<main>
  <span class="ufo" aria-hidden="true">🛸</span>
  <h1>World not found</h1>
  <p>You've drifted off the map — this world doesn't exist. Thirty very real ones are waiting, though.</p>
  <a href="/">← Back to all thirty</a>
</main>
</body>
</html>
