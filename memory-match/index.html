<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match — Emoji Pairs Game</title>
<meta name="description" content="A candy-sweet emoji memory game: pick Animals, Food, or Space, flip the cards, match the pairs, and race your best time across three difficulty levels.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5b3a5e;
    --soft:#8d6b90;
    --cream:#fff6fb;
    --pink:#ffd3e8;
    --mint:#c9f2e3;
    --lav:#e3d9ff;
    --accent:#e85d9f;
    --accent-dark:#c23e7f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 400px at 85% -100px, rgba(201,242,227,.8), rgba(201,242,227,0) 70%),
      radial-gradient(900px 400px at 10% -100px, rgba(227,217,255,.9), rgba(227,217,255,0) 70%),
      linear-gradient(180deg,#fff6fb,#ffeef6 60%,#f2ecff);
    min-height:100vh;
    padding-bottom:48px;
  }
  .hub-link{position:fixed;top:14px;left:14px;z-index:1000;padding:8px 14px;border-radius:999px;font:600 13px/1 Inter,system-ui,sans-serif;text-decoration:none;backdrop-filter:blur(8px);background:rgba(15,15,25,.55);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .hub-link:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

  header{text-align:center;padding:clamp(64px,10vh,90px) 16px 6px}
  h1{
    font-weight:900;
    font-size:clamp(2.1rem,6vw,3.6rem);
    color:var(--accent);
    text-shadow:0 3px 0 #fff;
  }
  .tagline{font-weight:800;color:var(--soft);margin-top:8px;font-size:clamp(1rem,2.4vw,1.25rem)}

  .panel{
    max-width:680px;
    margin:26px auto;
    padding:clamp(20px,4vw,36px);
    background:rgba(255,255,255,.85);
    border-radius:32px;
    box-shadow:0 10px 30px rgba(180,120,180,.18);
    border:3px solid #fff;
  }
  .panel h2{font-size:1.15rem;font-weight:900;color:var(--soft);letter-spacing:.6px;text-transform:uppercase;margin:18px 0 10px}
  .panel h2:first-child{margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{
    flex:1 1 140px;
    min-height:56px;
    border-radius:20px;
    border:3px solid #f0dcef;
    background:#fff;
    font-family:inherit;
    font-weight:900;
    font-size:1.05rem;
    color:var(--ink);
    cursor:pointer;
    padding:8px 12px;
    transition:transform .15s ease;
  }
  .chip small{display:block;font-weight:800;color:var(--soft);font-size:.8rem;margin-top:2px}
  .chip:hover{transform:translateY(-2px)}
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed="true"]{
    background:linear-gradient(135deg,var(--pink),#ffc2de);
    border-color:var(--accent);
    color:var(--accent-dark);
  }
  .chip[aria-pressed="true"] small{color:var(--accent-dark)}
  .btn{
    display:block;
    width:100%;
    margin-top:24px;
    min-height:64px;
    border:none;
    border-radius:24px;
    background:linear-gradient(135deg,var(--accent),#ff8ec2);
    color:#fff;
    font-family:inherit;
    font-weight:900;
    font-size:1.35rem;
    cursor:pointer;
    box-shadow:0 6px 0 var(--accent-dark);
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(2px)}
  .btn.ghost{
    background:#fff;
    color:var(--accent-dark);
    box-shadow:0 6px 0 #e9cfe4;
    border:3px solid #f0dcef;
  }
  .chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

  /* Game screen */
  #gameScreen{max-width:1100px;margin:0 auto;padding:0 clamp(10px,2.5vw,24px)}
  .hud{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
    margin:18px auto 20px;
  }
  .stat{
    background:rgba(255,255,255,.9);
    border:3px solid #fff;
    border-radius:18px;
    padding:10px 18px;
    font-weight:900;
    font-size:1.05rem;
    box-shadow:0 4px 12px rgba(180,120,180,.15);
    min-height:48px;
    display:flex;align-items:center;gap:8px;
  }
  .stat .label{color:var(--soft);font-size:.85rem;text-transform:uppercase;letter-spacing:.5px}
  .hud .btn-small{
    min-height:48px;
    padding:8px 20px;
    border:none;border-radius:18px;
    background:linear-gradient(135deg,var(--accent),#ff8ec2);
    color:#fff;font-family:inherit;font-weight:900;font-size:1rem;
    cursor:pointer;
    box-shadow:0 4px 0 var(--accent-dark);
    transition:transform .15s ease;
  }
  .hud .btn-small.alt{background:#fff;color:var(--accent-dark);box-shadow:0 4px 0 #e9cfe4;border:3px solid #f0dcef}
  .hud .btn-small:active{transform:translateY(2px)}
  .hud .btn-small:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

  .board{
    display:grid;
    gap:clamp(6px,1.5vw,14px);
    max-width:900px;
    margin:0 auto;
    perspective:1200px;
  }
  .card{
    position:relative;
    aspect-ratio:3/4;
    min-height:44px;
    border:none;
    background:transparent;
    cursor:pointer;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  .card-inner{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,1.4,.6,1);
  }
  .card.is-flipped .card-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:clamp(10px,2vw,20px);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .face.front{
    background:linear-gradient(145deg,#b989e8,#8f6fe0);
    border:3px solid #fff;
    box-shadow:0 4px 10px rgba(120,80,160,.3);
    color:rgba(255,255,255,.9);
    font-size:clamp(1.2rem,3.5vw,2rem);
    font-weight:900;
  }
  .face.back{
    background:linear-gradient(145deg,#fff,#ffeef8);
    border:3px solid var(--pink);
    transform:rotateY(180deg);
    font-size:clamp(1.6rem,5.5vw,3.2rem);
  }
  .card.matched .face.back{
    background:linear-gradient(145deg,#e2fff2,#c9f2e3);
    border-color:#63c9a4;
  }
  .card.matched .card-inner{animation:match-pop .5s ease}
  @keyframes match-pop{
    0%{transform:rotateY(180deg) scale(1)}
    45%{transform:rotateY(180deg) scale(1.18)}
    100%{transform:rotateY(180deg) scale(1)}
  }
  .card.shake .card-inner{animation:no-no .4s ease}
  @keyframes no-no{
    0%,100%{transform:rotateY(180deg) translateX(0)}
    30%{transform:rotateY(180deg) translateX(-5px)}
    60%{transform:rotateY(180deg) translateX(5px)}
  }

  /* Win overlay */
  .overlay{
    position:fixed;inset:0;z-index:900;
    display:flex;align-items:center;justify-content:center;
    background:rgba(90,50,90,.45);
    backdrop-filter:blur(6px);
    padding:16px;
  }
  .win-box{
    background:#fff;
    border-radius:36px;
    padding:clamp(24px,5vw,48px);
    max-width:460px;width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(90,40,90,.35);
    animation:rise .45s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
  .win-box h2{font-size:2rem;font-weight:900;color:var(--accent);margin-bottom:6px}
  .stars{font-size:clamp(2.4rem,8vw,3.4rem);letter-spacing:6px;margin:10px 0}
  .stars .dim{opacity:.25}
  .win-stats{font-weight:800;color:var(--soft);font-size:1.1rem;line-height:1.7;margin-bottom:8px}
  .new-best{color:#1d9d6f;font-weight:900;font-size:1.05rem;min-height:1.4em}
  [hidden]{display:none!important}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<a class="hub-link" href="https://thirty-worlds.vercel.app/" aria-label="All thirty sites">← All 30</a>

<header>
  <h1>🃏 Memory Match</h1>
  <p class="tagline">Flip the cards, find the pairs, beat your best time!</p>
</header>

<main>
  <section class="panel" id="setupScreen" aria-label="Game setup">
    <h2>Pick a theme</h2>
    <div class="chips" id="themeChips" role="group" aria-label="Theme">
      <button type="button" class="chip" data-theme="animals" aria-pressed="true">🐻 Animals</button>
      <button type="button" class="chip" data-theme="food" aria-pressed="false">🍩 Food</button>
      <button type="button" class="chip" data-theme="space" aria-pressed="false">🚀 Space</button>
    </div>
    <h2>Pick a difficulty</h2>
    <div class="chips" id="diffChips" role="group" aria-label="Difficulty">
      <button type="button" class="chip" data-diff="easy" aria-pressed="true">Easy<small>4 × 3 — 6 pairs</small></button>
      <button type="button" class="chip" data-diff="medium" aria-pressed="false">Medium<small>4 × 4 — 8 pairs</small></button>
      <button type="button" class="chip" data-diff="hard" aria-pressed="false">Hard<small>6 × 4 — 12 pairs</small></button>
    </div>
    <button type="button" class="btn" id="startBtn">Deal the cards! 🎴</button>
  </section>

  <section id="gameScreen" hidden aria-label="Memory board">
    <div class="hud">
      <div class="stat"><span class="label">Moves</span><span id="movesVal">0</span></div>
      <div class="stat"><span class="label">Time</span><span id="timeVal">0:00</span></div>
      <div class="stat"><span class="label">Pairs</span><span id="pairsVal">0/6</span></div>
      <button type="button" class="btn-small" id="restartBtn">🔄 New game</button>
      <button type="button" class="btn-small alt" id="setupBtn">⚙️ Setup</button>
    </div>
    <div class="board" id="board"></div>
  </section>
</main>

<div class="overlay" id="winOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="win-box">
    <h2 id="winTitle">You matched them all! 🎉</h2>
    <div class="stars" id="starRow" aria-label="Star rating"></div>
    <p class="win-stats" id="winStats"></p>
    <p class="new-best" id="newBest"></p>
    <button type="button" class="btn" id="againBtn">Play again 🎴</button>
    <button type="button" class="btn ghost" id="changeBtn">Change theme or difficulty</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
(function(){
  "use strict";
  var REDUCED = false;
  try { REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

  var THEMES = {
    animals: ["🐶","🐱","🦊","🐻","🐼","🐨","🦁","🐯","🐸","🐵","🐷","🐰","🐢","🦋","🐙","🦉"],
    food:    ["🍎","🍌","🍇","🍓","🍉","🍒","🥕","🌽","🍕","🍔","🍩","🍪","🧁","🍦","🥑","🍿"],
    space:   ["🚀","🛸","🪐","🌙","⭐","🌞","🌍","👽","☄️","🔭","🌠","💫","🛰️","👨‍🚀","🌌","✨"]
  };
  var DIFFS = {
    easy:   { cols: 4, rows: 3, pairs: 6,  label: "Easy" },
    medium: { cols: 4, rows: 4, pairs: 8,  label: "Medium" },
    hard:   { cols: 6, rows: 4, pairs: 12, label: "Hard" }
  };

  var theme = "animals";
  var diff = "easy";

  var setupScreen = document.getElementById("setupScreen");
  var gameScreen = document.getElementById("gameScreen");
  var board = document.getElementById("board");
  var movesVal = document.getElementById("movesVal");
  var timeVal = document.getElementById("timeVal");
  var pairsVal = document.getElementById("pairsVal");
  var winOverlay = document.getElementById("winOverlay");
  var starRow = document.getElementById("starRow");
  var winStats = document.getElementById("winStats");
  var newBest = document.getElementById("newBest");

  var deck = [];
  var first = null, second = null, locked = false;
  var moves = 0, found = 0, seconds = 0;
  var timerId = null, timerRunning = false;

  function storageGet(key){
    try { return window.localStorage.getItem(key); } catch(e){ return null; }
  }
  function storageSet(key, val){
    try { window.localStorage.setItem(key, val); } catch(e){}
  }

  function fmt(s){
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function pressGroup(container, attr, value){
    var btns = container.querySelectorAll(".chip");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute(attr) === value ? "true" : "false");
    }
  }

  document.getElementById("themeChips").addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if (!btn) { return; }
    theme = btn.getAttribute("data-theme");
    pressGroup(this, "data-theme", theme);
  });
  document.getElementById("diffChips").addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if (!btn) { return; }
    diff = btn.getAttribute("data-diff");
    pressGroup(this, "data-diff", diff);
  });

  function stopTimer(){
    if (timerId) { clearInterval(timerId); timerId = null; }
    timerRunning = false;
  }
  function startTimer(){
    if (timerRunning) { return; }
    timerRunning = true;
    timerId = setInterval(function(){
      if (document.hidden) { return; }
      seconds += 1;
      timeVal.textContent = fmt(seconds);
    }, 1000);
  }

  function applyCols(){
    var d = DIFFS[diff];
    var cols = d.cols;
    if (cols === 6 && window.innerWidth < 560) { cols = 4; }
    board.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
    board.style.maxWidth = (cols * 150) + "px";
  }
  window.addEventListener("resize", applyCols);

  function newGame(){
    var d = DIFFS[diff];
    var emojis = shuffle(THEMES[theme].slice()).slice(0, d.pairs);
    deck = shuffle(emojis.concat(emojis).slice());
    first = null; second = null; locked = false;
    moves = 0; found = 0; seconds = 0;
    stopTimer();
    movesVal.textContent = "0";
    timeVal.textContent = "0:00";
    pairsVal.textContent = "0/" + d.pairs;
    winOverlay.hidden = true;
    board.innerHTML = "";
    applyCols();

    deck.forEach(function(emoji, i){
      var card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.setAttribute("data-emoji", emoji);
      card.setAttribute("aria-label", "Hidden card " + (i + 1) + " of " + deck.length);
      var inner = document.createElement("div");
      inner.className = "card-inner";
      var frontFace = document.createElement("div");
      frontFace.className = "face front";
      frontFace.textContent = "✦";
      var backFace = document.createElement("div");
      backFace.className = "face back";
      backFace.textContent = emoji;
      inner.appendChild(frontFace);
      inner.appendChild(backFace);
      card.appendChild(inner);
      card.addEventListener("click", function(){ flip(card); });
      board.appendChild(card);
    });
  }

  function flip(card){
    if (locked) { return; }
    if (card.classList.contains("is-flipped") || card.classList.contains("matched")) { return; }
    startTimer();
    card.classList.add("is-flipped");
    card.setAttribute("aria-label", "Revealed card: " + card.getAttribute("data-emoji"));

    if (!first) { first = card; return; }
    second = card;
    locked = true;
    moves += 1;
    movesVal.textContent = String(moves);

    if (first.getAttribute("data-emoji") === second.getAttribute("data-emoji")) {
      var a = first, b = second;
      setTimeout(function(){
        a.classList.add("matched");
        b.classList.add("matched");
        a.disabled = true;
        b.disabled = true;
        found += 1;
        pairsVal.textContent = found + "/" + DIFFS[diff].pairs;
        first = null; second = null; locked = false;
        if (found === DIFFS[diff].pairs) { win(); }
      }, 250);
    } else {
      var c = first, e2 = second;
      c.classList.add("shake");
      e2.classList.add("shake");
      setTimeout(function(){
        c.classList.remove("is-flipped", "shake");
        e2.classList.remove("is-flipped", "shake");
        c.setAttribute("aria-label", "Hidden card");
        e2.setAttribute("aria-label", "Hidden card");
        first = null; second = null; locked = false;
      }, 850);
    }
  }

  function starCount(){
    var p = DIFFS[diff].pairs;
    if (moves <= Math.round(p * 1.6)) { return 3; }
    if (moves <= Math.round(p * 2.4)) { return 2; }
    return 1;
  }

  function win(){
    stopTimer();
    var stars = starCount();
    var html = "";
    for (var i = 1; i <= 3; i++) {
      html += "<span class=\"" + (i <= stars ? "" : "dim") + "\">⭐</span>";
    }
    starRow.innerHTML = html;
    starRow.setAttribute("aria-label", stars + " out of 3 stars");
    winStats.textContent = DIFFS[diff].label + " · " + theme.charAt(0).toUpperCase() + theme.slice(1) +
      " — solved in " + moves + " moves and " + fmt(seconds) + ".";

    var key = "memorymatch-best-" + diff;
    var prev = parseInt(storageGet(key) || "0", 10);
    if (!prev || seconds < prev) {
      storageSet(key, String(seconds));
      newBest.textContent = prev
        ? "🏆 New best time! (old best: " + fmt(prev) + ")"
        : "🏆 New best time for " + DIFFS[diff].label + "!";
    } else {
      newBest.textContent = "Best " + DIFFS[diff].label + " time: " + fmt(prev);
    }

    winOverlay.hidden = false;
    document.getElementById("againBtn").focus();

    if (!REDUCED && typeof confetti !== "undefined") {
      confetti({ particleCount: 120, spread: 90, origin: { y: 0.35 } });
      setTimeout(function(){
        if (document.hidden) { return; }
        confetti({ particleCount: 60, spread: 120, origin: { x: 0.2, y: 0.5 } });
        confetti({ particleCount: 60, spread: 120, origin: { x: 0.8, y: 0.5 } });
      }, 350);
    }
  }

  document.getElementById("startBtn").addEventListener("click", function(){
    setupScreen.hidden = true;
    gameScreen.hidden = false;
    newGame();
  });
  document.getElementById("restartBtn").addEventListener("click", newGame);
  document.getElementById("setupBtn").addEventListener("click", function(){
    stopTimer();
    winOverlay.hidden = true;
    gameScreen.hidden = true;
    setupScreen.hidden = false;
  });
  document.getElementById("againBtn").addEventListener("click", newGame);
  document.getElementById("changeBtn").addEventListener("click", function(){
    winOverlay.hidden = true;
    gameScreen.hidden = true;
    setupScreen.hidden = false;
  });
})();
</script>
</body>
</html>
